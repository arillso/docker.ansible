---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

"on":
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:
    workflow_call:
        inputs:
            upload-sarif:
                description: "Upload SARIF results to GitHub Code Scanning"
                type: boolean
                default: true

concurrency:
    # Fixed name, not github.workflow: when merge.yml calls this workflow,
    # github.workflow resolves to the caller's name, so both called workflows
    # shared one group and cancelled each other.
    group: nightly-security-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    codeql:
        # docker.ansible ships Python test tooling; the reusable workflow
        # defaults to Go, so the language has to be passed explicitly.
        #
        # security-codeql.yml uploads its SARIF unconditionally and exposes no
        # upload toggle, so the whole job is skipped when a caller opts out —
        # the trivy job below suppresses only its upload step for the same
        # reason. Without this, merge.yml would still push CodeQL results on
        # every merge to main despite passing upload-sarif: false.
        #
        # toJSON keeps schedule / workflow_dispatch runs uploading: they have no
        # inputs context, the input reads as null, and null == false is true in
        # Actions expressions. github.event_name cannot tell the cases apart — in
        # a called workflow it is the caller's event (push), never workflow_call.
        if: ${{ toJSON(inputs.upload-sarif) != 'false' }}
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-10-24
        with:
            language: python

    trivy:
        name: Trivy Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

            - name: Build image for scanning
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  push: false
                  load: true
                  tags: ansible:scan
                  cache-from: type=registry,ref=ghcr.io/arillso/ansible-cache:latest
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false

            # Reporting step: never gates, always produces SARIF for upload.
            - name: Run Trivy vulnerability scanner (report)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "ansible:scan"
                  format: "sarif"
                  output: "trivy-results.sarif"
                  severity: "CRITICAL,HIGH"
                  exit-code: "0"

            - name: Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              # Upload unless a caller passes upload-sarif: false; see the
              # codeql job for why the check goes through toJSON.
              if: ${{ always() && toJSON(inputs.upload-sarif) != 'false' }}
              with:
                  sarif_file: "trivy-results.sarif"

            # Gating step: fails the job on fixable CRITICAL/HIGH findings.
            # Runs after the upload so results reach Code Scanning either way.
            # Only the gate honours .trivyignore; the reporting step above keeps
            # sending every finding to Code Scanning.
            - name: Run Trivy vulnerability scanner (gate)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "ansible:scan"
                  format: "table"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true
                  trivyignores: ".trivyignore"
                  exit-code: "1"

    secrets:
        name: Secret Scanning
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: TruffleHog scan
              uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
                  head: HEAD
                  extra_args: --only-verified
