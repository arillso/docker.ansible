---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

"on":
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:
    workflow_call:
        inputs:
            upload-sarif:
                description: "Upload SARIF results to GitHub Code Scanning"
                type: boolean
                default: true

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    security-events: write
    actions: read

jobs:
    codeql:
        # docker.ansible ships Python test tooling; the reusable workflow
        # defaults to Go, so the language has to be passed explicitly.
        #
        # security-codeql.yml uploads its SARIF unconditionally and exposes no
        # upload toggle, so the whole job is skipped when a caller opts out —
        # the trivy job below suppresses only its upload step for the same
        # reason. Without this, merge.yml would still push CodeQL results on
        # every merge to main despite passing upload-sarif: false.
        if: ${{ !(github.event_name == 'workflow_call' && inputs.upload-sarif == false) }}
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-08-07
        with:
            language: python

    trivy:
        name: Trivy Scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

            - name: Build image for scanning
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
              with:
                  context: .
                  push: false
                  load: true
                  tags: ansible:scan
                  cache-from: type=registry,ref=ghcr.io/arillso/ansible-cache:latest
                  cache-to: type=gha,mode=max
                  provenance: false
                  sbom: false

            # Reporting step: never gates, always produces SARIF for upload.
            - name: Run Trivy vulnerability scanner (report)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "ansible:scan"
                  format: "sarif"
                  output: "trivy-results.sarif"
                  severity: "CRITICAL,HIGH"
                  exit-code: "0"

            - name: Upload Trivy scan results
              uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
              # Upload unless a caller explicitly opts out. On schedule /
              # workflow_dispatch there is no `inputs` context, so the bare
              # `inputs.upload-sarif != false` evaluated false and silently
              # skipped the upload — leaving Code Scanning stale. Skip only
              # when a workflow_call caller passes upload-sarif: false.
              if: ${{ always() && !(github.event_name == 'workflow_call' && inputs.upload-sarif == false) }}
              with:
                  sarif_file: "trivy-results.sarif"

            # Gating step: fails the job on fixable CRITICAL/HIGH findings.
            # Runs after the upload so results reach Code Scanning either way.
            # Only the gate honours .trivyignore; the reporting step above keeps
            # sending every finding to Code Scanning.
            - name: Run Trivy vulnerability scanner (gate)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: "ansible:scan"
                  format: "table"
                  severity: "CRITICAL,HIGH"
                  ignore-unfixed: true
                  trivyignores: ".trivyignore"
                  exit-code: "1"

    secrets:
        name: Secret Scanning
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: TruffleHog scan
              uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
              with:
                  path: ./
                  base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
                  head: HEAD
                  extra_args: --only-verified
